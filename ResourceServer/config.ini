[ResourceServer]
name = ResourceServer
host = 127.0.0.1
port = 9090
# ChatServer 使用此 gRPC 端口核验已完成图片；TCP 上传/下载端口仍为 9090。
rpcport = 50057
file_path = ./uploads

# 1007 下载会向 StatusServer 校验登录 token，并在共享聊天库检查 private_chat 成员关系
# 与 resource_id 是否真的属于该 thread_id。应与 ChatServer 使用同一套配置。
[StatusServer]
host = 127.0.0.1
port = 50052

[Mysql]
host = 127.0.0.1
user = root
port = 33060
passwd = 123456
schema = chat_app_db
