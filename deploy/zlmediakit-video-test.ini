; ZLMediaKit 08329b3：Windows/WSL mirrored 单机双客户端连通测试。
; 使用 -c 显式加载本文件；不改 GateServer 的 8080。
; 此配置仅绑定回环，没有公网媒体授权；不要直接暴露到公网。
[general]
listen_ip=127.0.0.1
mediaServerId=chat-video-test
maxStreamWaitMS=15000

[http]
port=18080
sslport=0
allow_ip_range=127.0.0.1,::1
allow_origins=*
dirMenu=0

[rtc]
externIP=127.0.0.1
port=18000
tcpPort=18000
preferredCodecV=VP8
preferredCodecA=opus
signalingPort=0
signalingSslPort=0
icePort=0
iceTcpPort=0

[protocol]
enable_audio=1
add_mute_audio=0
enable_rtsp=1
rtsp_demand=0
enable_rtmp=0
enable_hls=0
enable_hls_fmp4=0
enable_mp4=0
enable_ts=0
enable_fmp4=0
continue_push_ms=0
auto_close=0

[hook]
enable=0

[rtsp]
port=0
sslport=0
[rtmp]
port=0
sslport=0
[rtp_proxy]
port=0
[srt]
port=0
[shell]
port=0
[onvif]
port=0
