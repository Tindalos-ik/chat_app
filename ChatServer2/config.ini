[Mysql]
host = 127.0.0.1
user = root
port = 33060
passwd = 123456
schema = chat_app_db
poolsize = 5

[StatusServer]
host = 127.0.0.1
port = 50052

[Redis]
host = 127.0.0.1
port = 6379
passwd = 123456

# 图片消息发送前通过 ResourceServer 的 gRPC 服务核验资源已完成且确为图片。
# 此文件不会被 sync_chatservers.ps1 覆盖，因此两个 ChatServer 都要各自保留该配置。
[ResourceServer]
host = 127.0.0.1
rpcport = 50057
# 与ResourceServer配置相同的私有服务凭据；空值使群头像核验默认拒绝，不使用公共默认密钥。
service_key =

[SelfChatServer]
name = ChatServer2
host = 127.0.0.1
port = 8091
rpcport = 50056

[PeerServer] 
servers = ChatServer1 

[ChatServer1]
name = ChatServer1
host = 127.0.0.1
port = 8090
rpcport = 50055

# 原单向固定文件test与好友双向语音共用媒体开关和地址；仅可信回环测试部署，未接入短时媒体鉴权，客户端不获得ZLM管理secret。
[VideoTest]
enabled = true
media_url = http://127.0.0.1:18080
