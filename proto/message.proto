syntax = "proto3";

package message;

// 验证码服务：客户端通过 GateServer 间接调用 VarifyServer。
service VarifyService {
    rpc GetVarifyCode (GetVarifyReq) returns (GetVarifyRsp) {}
}

message GetVarifyReq {
    string email = 1;
}

message GetVarifyRsp {
    int32 error = 1;
    string email = 2;
    string code = 3;
}

// StatusServer 为客户端选择 ChatServer，并校验 ChatServer 登录凭证。
message GetChatServerReq {
    int32 uid = 1;
}

message GetChatServerRsp {
    int32 error = 1;
    string host = 2;
    string port = 3;
    string token = 4;
}

message LoginReq {
    int32 uid = 1;
    string token = 2;
}

message LoginRsp {
    int32 error = 1;
    int32 uid = 2;
    string token = 3;
}

service StatusService {
    rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
    rpc Login (LoginReq) returns (LoginRsp) {}
}

// ==================== 资源服务与聊天服务之间的 RPC 通信 ====================
// ResourceServer 是上传文件是否已经发布的唯一可信来源。ChatServer 不读取资源服务的
// 文件系统，也不相信客户端带来的文件名、MIME、尺寸和大小。
message ResourceVerifyReq {
    // 按聊天图片请求中的原始顺序传入 resource_id；服务端按同一顺序回传可信元数据。
    repeated string resource_ids = 1;
}

message VerifiedImageResource {
    string resource_id = 1;
    string name = 2;
    string mime_type = 3;
    uint64 file_size = 4;
    uint32 width = 5;
    uint32 height = 6;
}

message ResourceVerifyRsp {
    // 0 表示所有资源均已完成且是可识别图片；非 0 时 resources 为空，避免部分成功落库。
    int32 error = 1;
    repeated VerifiedImageResource resources = 2;
}

service ResourceService {
    // 原子核验一批聊天图片：任意一项未完成、缺失或不是图片，整批失败。
    rpc VerifyImages (ResourceVerifyReq) returns (ResourceVerifyRsp) {}
}

// ==================== 聊天服务器之间的 RPC 通信 ====================
// ChatServer 通过这些 gRPC 接口把业务转发给另一台 ChatServer。

// 当前服务器向目标用户所在的 ChatServer 发起好友申请。
message AddFriendReq {
    int32 applyuid = 1; // 申请好友的用户 id
    string name = 2; // 申请用户的昵称，用于展示好友申请
    string desc = 3; // 好友申请附言
    string icon = 4; // 申请好友的用户头像
    string nick = 5; // 申请好友的昵称
    int32 sex = 6; // 申请好友的性别
    int32 touid = 7; // 被申请用户 id
}

message AddFriendRsp {
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 applyuid = 2; // 申请用户 id，用于匹配本次申请
    string name = 3; // 申请用户用户名，用于通知接收方
    int32 touid = 4; // 被申请用户 id，用于匹配本次申请
}

// 当前服务器向申请方所在的 ChatServer 转发好友申请处理结果。
message RplyFriendReq {
    int32 rplyuid = 1; // 回复申请的用户 id
    bool agree = 2; // 是否同意好友申请
    int32 touid = 3; // 原好友申请的申请用户 id
}

message RplyFriendRsp {
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 rplyuid = 2; // 回复申请的用户 id
    int32 touid = 3; // 原好友申请的申请用户 id
}

// 当前服务器向目标用户所在的 ChatServer 转发聊天消息。
message SendChatMsgReq {
    int32 fromuid = 1; // 消息发送者 id
    int32 touid = 2; // 消息接收者 id
    string message = 3; // 聊天消息内容
}

message SendChatMsgRsp {
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 fromuid = 2; // 消息发送者 id
    int32 touid = 3; // 消息接收者 id
}

// 好友认证成功后自动写入私聊并通知双方的初始消息。
// msg_id/thread_id 当前沿用 int32；服务端在落库后会校验其未超出该协议范围。
message AddFriendMsg{
  int32 sender_id = 1; // 初始消息发送者（本次认证的同意方）
  string unique_id = 2; // 稳定的消息唯一标识，网络重试时保持不变
  int32 msg_id = 3; // chat_message.message_id
  int32 thread_id = 4; // private_chat.thread_id
  string msgcontent = 5; // 展示给双方的初始消息正文
}

// 好友认证通知：fromuid 为认证方，touid 为接收认证通知的原申请方。
message AuthFriendReq{
  int32 fromuid = 1;
  int32 touid = 2;
  repeated AddFriendMsg textmsgs = 3;
}

message AuthFriendRsp {
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 uid = 2; // 处理申请的用户 id
    int32 touid = 3; // 原好友申请的申请用户 id
}

// 批量转发文本聊天消息。
message TextChatMsgReq {
    int32 fromuid = 1; // 消息发送者 id
    int32 touid = 2; // 消息接收者 id
    repeated TextChatData textmsgs = 3; // 待推送的文本消息列表
}

message TextChatMsgRsp {
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 fromuid = 2; // 消息发送者 id
    int32 touid = 3; // 消息接收者 id
    repeated TextChatData textmsgs = 4; // 已推送的文本消息列表
}

message TextChatData {
    string msgid = 1; // 客户端 UUID：发送方关联确认、失败气泡和后续重试使用
    string msgcontent = 2; // 文本消息内容
    // 以下字段由源 ChatServer 在 MySQL 成功写入 chat_message 后填充。跨服文本通知
    uint64 message_id = 3; // chat_message.message_id，客户端 SQLite 的去重主键
    uint64 thread_id = 4; // chat_thread/private_chat 的正式会话 ID
    int32 sender_id = 5; // 发送者 UID
    int32 recv_id = 6; // 接收者 UID
    uint64 created_at_ms = 7; // 服务端确认后的创建时间（Unix 毫秒）
    int32 status = 8; // 0=未读，1=已读，2=撤回
}

// 批量转发已持久化的图片聊天消息。图片二进制不经过 ChatServer；客户端根据
// resource_id 继续使用 ResourceServer 的 1007/1008 分片下载协议拉取。
message ImageChatData {
    string msgid = 1; // 客户端 UUID，用于发送确认和失败气泡关联
    string resource_id = 2;
    string name = 3;
    string mime_type = 4;
    uint64 file_size = 5;
    uint32 width = 6;
    uint32 height = 7;
    uint64 message_id = 8;
    uint64 thread_id = 9;
    int32 sender_id = 10;
    int32 recv_id = 11;
    uint64 created_at_ms = 12;
    int32 status = 13;
}

message ImageChatMsgReq {
    int32 fromuid = 1;
    int32 touid = 2;
    repeated ImageChatData imagemsgs = 3;
}

message ImageChatMsgRsp {
    int32 error = 1;
    int32 fromuid = 2;
    int32 touid = 3;
    repeated ImageChatData imagemsgs = 4;
}

message KickUserReq{
    int32 uid = 1; // 被踢用户的 uid
    string session_id = 2; // 发起方在 Redis 中读到的旧会话 id，用于防止陈旧 RPC 误踢新会话
}

message KickUserRsp{
    int32 error = 1;
    int32 uid = 2;
}

// 接收端完成实际界面绘制后，由其所在 ChatServer 转发给发送端所在 ChatServer。
// message_ids 是已持久化的 chat_message 主键；重复 ACK 按幂等成功处理。
message MessageDisplayedReq {
    int32 sender_id = 1;
    int32 reader_id = 2;
    uint64 thread_id = 3;
    repeated uint64 message_ids = 4;
}

message MessageDisplayedRsp {
    int32 error = 1;
}

// 已读使用会话内单调 message_id 游标，服务端只更新 reader_id 实际收到的消息。
message ThreadReadReq {
    int32 sender_id = 1;
    int32 reader_id = 2;
    uint64 thread_id = 3;
    uint64 read_through_message_id = 4;
}

message ThreadReadRsp {
    int32 error = 1;
}

// 聊天服务器之间的 gRPC 服务定义。
service ChatService {
    // 转发好友申请，由接收方所在服务器通知目标用户。
    rpc NotifyAddFriend (AddFriendReq) returns (AddFriendRsp) {}
    // 转发单条聊天消息，由接收方所在服务器推送给目标用户。
    rpc SendChatMsg (SendChatMsgReq) returns (SendChatMsgRsp) {}
    // 转发好友认证结果，通知申请用户双方已建立或未建立好友关系。
    rpc NotifyAuthFriend (AuthFriendReq) returns (AuthFriendRsp) {}
    // 批量转发文本聊天消息，由接收方所在服务器推送给目标用户。
    rpc NotifyTextChatMsg (TextChatMsgReq) returns (TextChatMsgRsp) {}
    // 批量转发已核验、已落库的图片消息，由接收方所在服务器推送给目标用户。
    rpc NotifyImageChatMsg (ImageChatMsgReq) returns (ImageChatMsgRsp) {}
    // 通知消息已显示，由接收方所在服务器通知目标用户。
    rpc NotifyMessageDisplayed (MessageDisplayedReq) returns (MessageDisplayedRsp) {}
    // 通知消息已读，由接收方所在服务器通知目标用户。
    rpc NotifyThreadRead (ThreadReadReq) returns (ThreadReadRsp) {}
    // 踢出用户，由接收方所在服务器通知目标用户。
    rpc NotifyKickUser (KickUserReq) returns (KickUserRsp) {}
}
