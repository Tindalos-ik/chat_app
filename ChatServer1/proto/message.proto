/*.proto 文件，就是用Protobuf 的语法，来定义数据结构和服务接口的文本文件，作用
定义数据：用 .proto 文件来描述你想要存储或传输的数据长什么样。比如，一个“用户”对象包含 姓名、年龄、邮箱 等字段。
定义服务：结合 gRPC，可以在 .proto 文件中定义远程服务，比如一个登录方法，它接收“用户名/密码”这个数据，并返回“登录结果”这个数据。
生成代码：写好的 .proto 文件，可以通过 protoc 这个编译器，自动生成 C++、Python、Java、Go 等语言的代码。这些生成的代码包含了：
    数据类：可以像普通对象一样设置/获取字段，并能轻松地将对象序列化为二进制数据或从二进制数据反序列化。
    服务接口：在 gRPC 中，会生成客户端 Stub 和服务端 Service 基类。*/


syntax = "proto3"; // 指定使用 proto3 语法

package message; // 指定包名，可以理解为class

/*这个service定义了一个服务接口，接口名为VarifyService，它有一个远程方法GetVarifyCode，接收一个GetVarifyReq类型的请求，返回一个GetVarifyRsp类型的响应。
 当这个文件被编译之后，这个接口就变成了一个c++纯虚函数
 在服务端：需要写一个具体的类，继承并实现这个抽象接口。编译器会强制你写出 GetVarifyCode 这个函数的具体逻辑，
 比如：“收到请求后，怎么生成验证码，怎么发送邮件”。

 在客户端（发起请求的代码）：你会得到一个“代理类”（Stub）。在你的代码里调用 stub->GetVarifyCode，就像在本地调用一个普通函数一样。
 这个代理类会负责把所有参数打包，通过网络发给服务器，并等待服务器的返回结果。*/

service VarifyService { 
    rpc GetVarifyCode (GetVarifyReq) returns (GetVarifyRsp) {} // 定义一个远程方法
}

message GetVarifyReq { // 定义一个请求消息
    string email = 1;
}

message GetVarifyRsp { // 定义一个响应消息
    int32 error = 1;
    string email = 2;
    string code = 3;
}

message GetChatServerReq {
    int32 uid = 1;
}

message GetChatServerRsp {
    int32 error = 1;
    string host = 2;
    string port = 3;
    string token = 4;
}

message LoginReq{
    int32 uid = 1;
    string token = 2;
}

message LoginRsp{
    int32 error = 1;
    int32 uid = 2;
    string token = 3;
}

service StatusService {
    rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
    rpc Login (LoginReq) returns (LoginRsp) {}
}


