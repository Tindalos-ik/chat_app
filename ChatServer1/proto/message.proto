/*.proto 文件，就是用Protobuf 的语法，来定义数据结构和服务接口的文本文件，作用
定义数据：用 .proto 文件来描述你想要存储或传输的数据长什么样。比如，一个“用户”对象包含 姓名、年龄、邮箱 等字段。
定义服务：结合 gRPC，可以在 .proto 文件中定义远程服务，比如一个登录方法，它接收“用户名/密码”这个数据，并返回“登录结果”这个数据。
生成代码：写好的 .proto 文件，可以通过 protoc 这个编译器，自动生成 C++、Python、Java、Go 等语言的代码。这些生成的代码包含了：
    数据类：可以像普通对象一样设置/获取字段，并能轻松地将对象序列化为二进制数据或从二进制数据反序列化。
    服务接口：在 gRPC 中，会生成客户端 Stub 和服务端 Service 基类。*/


syntax = "proto3"; // 指定使用 proto3 语法

package message; // 指定包名，可以理解为class

/*这个service定义了一个服务接口，接口名为VarifyService，它有一个远程方法GetVarifyCode，接收一个GetVarifyReq类型的请求，返回一个GetVarifyRsp类型的响应。
 当这个文件被编译之后，这个接口就变成了一个c++纯虚函数
 在服务端：需要写一个具体的类，继承并实现这个抽象接口。编译器会强制你写出 GetVarifyCode 这个函数的具体逻辑，
 比如：“收到请求后，怎么生成验证码，怎么发送邮件”。

 在客户端（发起请求的代码）：你会得到一个“代理类”（Stub）。在你的代码里调用 stub->GetVarifyCode，就像在本地调用一个普通函数一样。
 这个代理类会负责把所有参数打包，通过网络发给服务器，并等待服务器的返回结果。*/

service VarifyService { 
    rpc GetVarifyCode (GetVarifyReq) returns (GetVarifyRsp) {} // 定义一个远程方法
}

message GetVarifyReq { // 定义一个请求消息
    string email = 1;
}

message GetVarifyRsp { // 定义一个响应消息
    int32 error = 1;
    string email = 2;
    string code = 3;
}

// 获取聊天服务器请求消息
message GetChatServerReq {
    int32 uid = 1;
}

// 获取聊天服务器回包消息
message GetChatServerRsp {
    int32 error = 1;
    string host = 2;
    string port = 3;
    string token = 4;
}

message LoginReq{
    int32 uid = 1;
    string token = 2;
}

message LoginRsp{
    int32 error = 1;
    int32 uid = 2;
    string token = 3;
}

service StatusService {
    rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
    rpc Login (LoginReq) returns (LoginRsp) {}
}


// 聊天服务器之间的 RPC 通信
//
// ChatServer 通过这些 gRPC 接口把业务转发给另一台 ChatServer：
// 例如，好友或聊天消息的接收方不在当前服务器时，当前服务器调用
// 对端的接口，由对端找到对应的在线会话并通知客户端。

// 当前服务器向目标用户所在的 ChatServer 发起好友申请。
message AddFriendReq {
    int32 applyuid = 1; // 申请好友的用户 id
    string name = 2; // 申请用户的昵称，用于展示好友申请
    string desc = 3; // 好友申请附言
    int32 touid = 4; // 被申请用户 id
}

message AddFriendRsp {
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 applyuid = 2; // 申请用户 id，用于匹配本次申请
    string name = 3; // 申请用户昵称，用于通知接收方
}

// 当前服务器向申请方所在的 ChatServer 转发好友申请处理结果。
message RplyFriendReq{
    int32 rplyuid = 1; // 回复申请的用户 id
    bool agree = 2; // 是否同意好友申请
    int32 touid = 3; // 原好友申请的申请用户 id
}

message RplyFriendRsp{
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 rplyuid = 2; // 回复申请的用户 id
    bool touid = 3; // 预留字段，保留现有协议定义
}

// 当前服务器向目标用户所在的 ChatServer 转发聊天消息。
message SendChatMsgReq{
    int32 fromuid = 1; // 消息发送者 id
    int32 touid = 2; // 消息接收者 id
    string message = 3; // 聊天消息内容
}

message SendChatMsgRsp{
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 fromuid = 2; // 消息发送者 id
    int32 touid = 3; // 消息接收者 id
}

// 好友认证通知：告诉对端 ChatServer，当前用户已同意或拒绝好友申请。
message AuthFriendReq{
    int32 uid = 1; // 处理申请的用户 id
    int32 touid = 2; // 原好友申请的申请用户 id
}

message AuthFriendRsp{
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 uid = 2; // 处理申请的用户 id
    int32 touid = 3; // 原好友申请的申请用户 id
}

// 批量转发文本聊天消息，适用于离线期间积压消息或多条消息的集中推送。
message TextChatMsgReq{
    int32 fromuid = 1; // 消息发送者 id
    int32 touid = 2; // 消息接收者 id
    repeated TextChatData textmsgs = 3; // 待推送的文本消息列表
}

message TextChatMsgRsp{
    int32 error = 1; // 业务处理结果，0 表示成功
    int32 fromuid = 2; // 消息发送者 id
    int32 touid = 3; // 消息接收者 id
}

// 文本消息数据
message TextChatData{
    string msgid = 1; // 消息唯一标识，用于去重或确认消息
    string msgcontent = 2; // 文本消息内容
}

// 聊天服务器之间的 gRPC 服务定义。
service ChatService {
    // 转发好友申请，由接收方所在服务器通知目标用户。
    rpc NotifyAddFriend (AddFriendReq) returns (AddFriendRsp) {}
    // 转发好友申请的同意或拒绝结果，由申请方所在服务器通知申请用户。
    rpc RplyAddFriend (RplyFriendReq) returns (RplyFriendRsp) {}
    // 转发单条聊天消息，由接收方所在服务器推送给目标用户。
    rpc SendChatMsg (SendChatMsgReq) returns (SendChatMsgRsp) {}
    // 转发好友认证结果，通知申请用户双方已建立或未建立好友关系。
    rpc NotifyAuthFriend (AuthFriendReq) returns (AuthFriendRsp) {}
    // 批量转发文本聊天消息，由接收方所在服务器推送给目标用户。
    rpc NotifyTextChatMsg (TextChatMsgReq) returns (TextChatMsgRsp) {}
}




