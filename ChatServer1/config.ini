port = 33060
passwd = 123456
schema = chat_app_db
poolsize = 5

[StatusServer]
host = 127.0.0.1
port = 50052

[Redis]
host = 127.0.0.1
port = 6379
passwd = 123456

# 图片消息发送前调用 ResourceServer 的 gRPC 核验。此配置属于本 ChatServer 实例，
# sync_chatservers.ps1 不会复制；ChatServer2 应按实际部署单独配置或使用代码默认值。
[ResourceServer]
host = 127.0.0.1
rpcport = 50057
# Set a private matching ResourceServer credential before enabling group avatar publication.
service_key =

[SelfChatServer]
name = ChatServer1
host = 127.0.0.1
port = 8090
rpcport = 50055 

[PeerServer]
servers = ChatServer2

[ChatServer2]
name = ChatServer2
host = 127.0.0.1
port = 8091
rpcport = 50056

# 原单向固定文件test与好友双向语音共用媒体开关和地址；仅可信回环测试部署，未接入短时媒体鉴权，客户端不获得ZLM管理secret。
[VideoTest]
enabled = false
media_url = http://127.0.0.1:18080
