<!doctype html><!-- 历史语音资源由两种通话共用，设备范围来自服务端accepted类型。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src chatvideo:; style-src 'unsafe-inline'; media-src blob:; connect-src http: https:;"><!-- 资源与SDP还受Qt精确白名单约束。 -->
<title>好友通话</title>
<style>body{background:#15181d;color:#eee;font-family:sans-serif;margin:16px}#remote{width:100%;height:48px;background:#111}.video-call #remote{height:360px;object-fit:contain}#local{width:220px;height:140px;object-fit:contain;background:#111}#local[hidden]{display:none}</style>
</head>
<body>
<p>设备与连接状态请查看上方通话提示；本地预览不回放声音。</p>
<video id="remote" autoplay playsinline></video><!-- 唯一远端元素同时播放对方音画，语音时仅播放音轨。 -->
<video id="local" muted autoplay playsinline hidden></video><!-- 本地元素静音避免反馈，采集轨道保持启用继续发送。 -->
<script src="/qwebchannel.js"></script>
<script src="/voice_call/webrtc.js"></script><!-- 两类通话与固定测试共用一次SDP协商。 -->
<script src="/voice_call/media.js"></script>
</body>
</html>
